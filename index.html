function dec(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)).then(function(b){return new TextDecoder().decode(b)})}
function derive(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"])});
}
function remember(key){try{crypto.subtle.exportKey("raw",key).then(function(r){var s="";new Uint8Array(r).forEach(function(c){s+=String.fromCharCode(c)});localStorage.setItem(KEY,btoa(s))})}catch(e){}}
function tryStored(){
  var k=null;try{k=localStorage.getItem(KEY)}catch(e){}
  if(!k||!window.crypto||!crypto.subtle)return;
  crypto.subtle.importKey("raw",u8(k),"AES-GCM",false,["decrypt"]).then(dec).then(open).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}});
}
var f=document.getElementById("f"),msg=document.getElementById("msg");
if(!window.crypto||!crypto.subtle){msg.textContent="This page needs a secure (https) link to open."}
f.addEventListener("submit",function(e){
  e.preventDefault();msg.textContent="Opening…";
  var pw=document.getElementById("pw").value;
  derive(pw).then(function(key){return dec(key).then(function(h){remember(key);open(h)})}).catch(function(){msg.textContent="That password didn’t work. Try again."});
});
tryStored();
})();
</script>
</body></html>
